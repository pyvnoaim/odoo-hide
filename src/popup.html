<!doctype html>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#86868b; --hover:#f2f2f5; --accent:#714b67; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f23; --fg:#f5f5f7; --muted:#8e8e93; --hover:#2c2c31; } }
  body { margin:0; width:560px; font:13px -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; align-items:center; gap:8px; padding:12px 14px 8px; }
  h1 { font-size:14px; margin:0; flex:1; }
  #count { color:var(--muted); }
  button { border:0; background:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:0; }
  @media (prefers-color-scheme: dark) { button { color:#c39bb9; } }
  #grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:2px; padding:4px 8px 12px; }
  .app { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border-radius:10px; cursor:pointer; transition:opacity .15s, filter .15s; }
  .app:hover, .app:focus-visible { background:var(--hover); }
  .app:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .app.dragging { opacity:.5; }
  .app img { width:36px; height:36px; border-radius:8px; }
  .app span { font-size:11px; text-align:center; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .app.off { opacity:.35; filter:grayscale(1); }
  .empty { padding:0 14px 14px; color:var(--muted); margin:0; }
</style>
<header><h1>Odoo apps</h1><span id="count"></span><button id="reset" hidden>Reset order</button><button id="all" hidden>Show all</button></header>
<div id="grid"></div>
<p class="empty" id="empty">Open the Odoo home screen once, then reopen this.</p>
<script src="popup.js"></script>
