<!doctype html>
<!-- Open in a browser (or: chrome --headless --dump-dom file://.../test/popup.html), expect "PASS". -->
<meta charset="utf-8">
<header><span id="version"></span><span id="count"></span><button id="reset" hidden>Reset order</button><button id="all" hidden>Show all</button><a id="update" hidden></a></header>
<div id="grid"></div>
<p id="empty"></p>
<pre id="out"></pre>
<script>
  onerror = m => { out.textContent = 'FAIL\n' + m; }; // a crash is a failure, not a blank result
  // Settings saved by a pre-2.8 version: only in local; the popup's first change moves them to sync
  const local = { apps: [['a', 'A'], ['b', 'B'], ['c', 'C']], hidden: ['b'], order: ['c'] }, store = {};
  const area = data => ({
    get: (keys, cb) => cb(Object.fromEntries(keys.filter(k => k in data).map(k => [k, data[k]]))),
    set: o => Object.assign(data, structuredClone(o)),
  });
  // Only what Firefox really has: no runtime.requestUpdateCheck (calling it broke the 2.5 popup)
  window.chrome = {
    storage: { local: area(local), sync: area(store) },
    runtime: { id: 'odoo-hide@digisoolut.co', getManifest: () => ({ version: '2.9' }) },
  };
  // updates.json with a newer version; numeric compare, so 2.10 > 2.9
  window.fetch = async () => ({ json: async () => ({ addons: { 'odoo-hide@digisoolut.co': { updates: [
    { version: '2.9', update_link: 'https://x/v2.9.xpi' }, { version: '2.10', update_link: 'https://x/v2.10.xpi' }] } } }) });
</script>
<script src="../src/popup.js"></script>
<script>
  const fails = [];
  const check = (name, got, want) => JSON.stringify(got) !== JSON.stringify(want) && fails.push(`${name}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`);
  const ids = () => [...grid.children].map(t => t.dataset.id);
  const tile = id => grid.querySelector(`[data-id="${id}"]`);

  check('initial order (unordered first, like content.js)', ids(), ['a', 'b', 'c']);
  check('hidden marked', tile('b').ariaPressed, 'false');
  check('opening writes nothing to sync', store, {});

  tile('a').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
  check('Enter hides, old local settings carried into sync', [store.hidden, store.order], [['b', 'a'], ['c']]);
  tile('a').dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));
  check('Space shows', store.hidden, ['b']);

  // Drag c onto a: c moves before a, order saved on dragend
  const drag = (type, el) => el.dispatchEvent(new DragEvent(type, { dataTransfer: new DataTransfer(), bubbles: true, cancelable: true }));
  drag('dragstart', tile('c'));
  drag('dragover', tile('a'));
  check('drop handled', drag('drop', tile('a')), false); // dispatchEvent returns false when default prevented
  drag('dragend', tile('c'));
  check('drag reorders', store.order, ['c', 'a', 'b']);

  tile('a').click();
  all.click();
  check('show all', [store.hidden, grid.querySelectorAll('.off').length, tile('a').ariaPressed], [[], 0, 'true']);
  reset.click();
  check('reset order', [ids(), store.order], [['a', 'b', 'c'], []]);

  check('version shown', version.textContent, 'v2.9');
  setTimeout(() => { // after the updates.json fetch resolves
    check('update offered', [update.hidden, update.textContent, update.href], [false, 'Update to v2.10', 'https://x/v2.10.xpi']);
    out.textContent = fails.length ? 'FAIL\n' + fails.join('\n') : 'PASS';
  });
</script>
